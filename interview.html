  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #080812;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Fixed header ── */
    .app-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 60px; background: #080812;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Screen: Interview ── */
    #screenInterview { display: flex; flex-direction: column; min-height: 100vh; }
    #screenInterview .content {
      padding: 76px 20px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }

    .question-label {
      font-size: 18px; font-weight: 600;
      text-align: center; color: #d0d8f0;
      line-height: 1.7; min-height: 56px;
      max-width: 100%; white-space: pre-wrap;
    }

    /* ── Wave ── */
    .wave-container {
      position: relative; width: 160px; height: 160px;
      display: flex; align-items: center; justify-content: center;
    }
    .wave-ring {
      position: absolute; border-radius: 50%;
      border: 2px solid rgba(99,179,237,0.4); animation: none;
    }
    .wave-ring:nth-child(1) { width:100%; height:100%; }
    .wave-ring:nth-child(2) { width:75%; height:75%; }
    .wave-ring:nth-child(3) { width:50%; height:50%; }
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .wave-container.ai-speaking .wave-ring:nth-child(1) { animation: ripple 1.5s ease-out infinite; }
    .wave-container.ai-speaking .wave-ring:nth-child(2) { animation: ripple 1.5s ease-out infinite 0.3s; }
    .wave-container.ai-speaking .wave-ring:nth-child(3) { animation: ripple 1.5s ease-out infinite 0.6s; }
    .wave-container.user-speaking .wave-ring:nth-child(1) { border-color: rgba(72,199,142,0.5); animation: ripple 0.8s ease-out infinite; }
    .wave-container.user-speaking .wave-ring:nth-child(2) { border-color: rgba(72,199,142,0.4); animation: ripple 0.8s ease-out infinite 0.15s; }
    .wave-container.user-speaking .wave-ring:nth-child(3) { border-color: rgba(72,199,142,0.3); animation: ripple 0.8s ease-out infinite 0.3s; }
    .center-dot {
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(135deg,#63b3ed,#4299e1);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; box-shadow: 0 0 30px rgba(99,179,237,0.4);
      transition: background 0.3s, box-shadow 0.3s; z-index: 10;
    }
    .wave-container.user-speaking .center-dot {
      background: linear-gradient(135deg,#48c78e,#2d9e6e);
      box-shadow: 0 0 30px rgba(72,199,142,0.4);
    }

    .status-text { font-size: 13px; color: #666; text-align: center; min-height: 18px; transition: color 0.3s; }
    .status-text.speaking { color: #63b3ed; }
    .status-text.listening { color: #48c78e; }

    /* ── Answer card ── */
    .answer-card {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px 16px;
      display: flex; align-items: flex-start; gap: 10px;
      min-height: 56px;
    }
    .answer-text { flex: 1; font-size: 15px; color: #9eeac5; line-height: 1.6; }
    .answer-text.empty { color: #444; }
    .btn-edit-inline {
      background: none; border: none; font-size: 18px;
      cursor: pointer; padding: 0 4px; flex-shrink: 0;
    }
    .answer-edit-area { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .answer-edit-input {
      width: 100%; padding: 12px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px; color: #fff; font-size: 15px;
      font-family: inherit; resize: none; min-height: 80px;
    }
    .edit-actions { display: flex; gap: 10px; }
    .btn-save { flex: 1; padding: 10px; background: #4299e1; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-cancel { flex: 1; padding: 10px; background: transparent; border: 1px solid #555; border-radius: 8px; color: #aaa; font-size: 14px; cursor: pointer; }

    /* ── Guide card ── */
    .guide-card {
      width: 100%;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px; padding: 20px;
    }
    .guide-card h3 {
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      color: #7aa3c8; text-transform: uppercase; margin-bottom: 14px;
    }
    .guide-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .guide-list li { font-size: 14px; color: #b0b8cc; line-height: 1.6; display: flex; align-items: flex-start; gap: 10px; }
    .guide-list li .icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

    /* ── Start button ── */
    .btn-start {
      padding: 16px 48px;
      background: linear-gradient(135deg,#63b3ed,#4299e1);
      color: #fff; border: none; border-radius: 50px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: all 0.3s; box-shadow: 0 4px 24px rgba(99,179,237,0.35);
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(99,179,237,0.55); }
    .btn-start:disabled { background: #2a2a3a; color: #555; transform: none; box-shadow: none; cursor: not-allowed; }

    .error-msg { color: #e07070; font-size: 13px; text-align: center; display: none; }

    .btn-test {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 20px;
      color: #444;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-test:hover { color: #666; border-color: #555; }

    /* ── Screen: Confirmation ── */
    #screenConfirmation { display: none; flex-direction: column; height: 100vh; }

    .confirm-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: #080812; border-bottom: 1px solid rgba(72,199,142,0.25);
      padding: 14px 20px; text-align: center;
      font-size: 14px; font-weight: 600; color: #48c78e; line-height: 1.5;
    }

    .confirm-scroll { overflow-y: auto; padding: 80px 16px 110px; flex: 1; }

    .qa-item {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    }
    .qa-num { font-size: 10px; color: #7aa3c8; letter-spacing: 1px; font-weight: 600; margin-bottom: 2px; }
    .qa-q { font-size: 12px; color: #666; margin-bottom: 8px; }
    .qa-row { display: flex; align-items: flex-start; gap: 8px; }
    .qa-a { flex: 1; font-size: 15px; color: #e8e8f0; line-height: 1.6; }
    .qa-a.empty { color: #444; font-style: italic; }
    .btn-qa-edit { background: none; border: none; font-size: 16px; cursor: pointer; padding: 2px; flex-shrink: 0; }
    .qa-edit-wrap { display: flex; flex-direction: column; gap: 8px; }
    .qa-edit-input {
      width: 100%; padding: 10px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; color: #fff; font-size: 15px;
      font-family: inherit; resize: none; min-height: 70px;
    }
    .qa-edit-actions { display: flex; gap: 8px; }
    .btn-qa-save { flex: 1; padding: 9px; background: #4299e1; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-qa-cancel { flex: 1; padding: 9px; background: transparent; border: 1px solid #555; border-radius: 8px; color: #aaa; font-size: 14px; cursor: pointer; }

    .confirm-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(8,8,18,0.97); border-top: 1px solid rgba(255,255,255,0.07);
      padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom));
    }
    .btn-submit {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg,#48c78e,#2d9e6e);
      border: none; border-radius: 50px;
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 20px rgba(72,199,142,0.3);
      transition: all 0.3s;
    }
    .btn-submit:disabled { background: #2a2a3a; color: #555; box-shadow: none; cursor: not-allowed; }

    /* ── Screen: Language Select ── */
    #screenLang {
      display: flex; flex-direction: column; min-height: 100vh;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .lang-title {
      font-size: 17px; color: #d0d8f0; text-align: center;
      line-height: 1.8; margin-bottom: 32px;
    }
    .lang-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; width: 100%; max-width: 320px;
    }
    .btn-lang {
      padding: 18px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; color: #fff;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; text-align: center;
      font-family: inherit;
    }
    .btn-lang:hover { background: rgba(99,179,237,0.15); border-color: rgba(99,179,237,0.45); }
  </style>
</head>

  <!-- ════ Screen 0: Language Select ════ -->
  <div id="screenLang">
    <div class="lang-title">

      <button class="btn-lang" onclick="selectLanguage('id')">🇮🇩 Bahasa Indonesia</button>

  </div>

    <div class="content">

        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>

      <div class="status-text" id="statusText">面談を開始するにはボタンを押してください</div>


      <div class="error-msg" id="errorMsg"></div>

      <button class="btn-start" id="btnStart" onclick="startInterview()">面談を開始する</button>

      <div class="guide-card" id="guideCard">

        <ul class="guide-list">

          <li><span class="icon">✋</span><span>話の途中で割り込んでOKです！自然に会話できます</span></li>
          <li><span class="icon">🔄</span><span>聞き取れなかった場合は「もう一度お願いします」と言えばOKです</span></li>
          <li><span class="icon">⏱️</span><span>面談は約30〜40分程度です</span></li>

  <!-- ════ Screen 2: Confirmation ════ -->
  <div id="screenConfirmation">
    <div class="confirm-header">✅ 面談お疲れ様でした。内容を確認してください。</div>
    <div class="confirm-scroll" id="confirmScroll"></div>
    <div class="confirm-footer">
      <button class="btn-submit" id="btnSubmit" onclick="submitInterview()">送信して終了する</button>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      "お名前",
      "生年月日", "性別", "国籍",
      "日本のビザの種類", "ビザの有効期限",
      "運転免許の種類", "その他の資格", "経験のある仕事",
      "合格した技能試験", "合格した日本語試験", "キャリアアップカード",
      "身長", "体重", "靴のサイズ", "服のサイズ",
      "就業状況",
      "希望の業種", "希望の勤務地", "希望する仕事内容", "譲れない希望条件", "一時帰国の予定日",
      "犯罪歴", "ビザの不許可歴", "強制送還・出国命令歴",
      "配偶者", "宗教上の食事制限", "血液型", "趣味・特技",
      "タトゥー", "喫煙", "飲酒",
      "日本で働きたい理由", "特定技能2号の目標", "健康状態", "お金の使途"
    ];
    // index 0 = お名前（名前確認フロー）, index 1-35 = 質問1-35

    let answers = QUESTIONS.map(q => ({ question: q, answer: "" }));
    let currentQIndex = 0;
    let pc = null, dc = null, audioEl = null;
    let sessionId = null, isConnected = false;
    let currentAiText = '', saveTimer = null;
    let selectedLanguage = 'ja';

    function selectLanguage(lang) {
      selectedLanguage = lang;
      document.getElementById('screenLang').style.display = 'none';
      document.getElementById('screenInterview').style.display = 'flex';
    }

    function generateSessionId() {
      return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    function setStatus(text, type = '') {
      const el = document.getElementById('statusText');
      el.textContent = text;
      el.className = 'status-text ' + type;
    }

    function setWaveState(state) {
      document.getElementById('waveContainer').className = 'wave-container ' + state;
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function updateQuestionUI() {
      const badge = document.getElementById('questionProgress');
      const label = document.getElementById('questionLabel');
      if (!badge) return;
      if (currentQIndex === 0) {
        badge.textContent = '名前確認';
        label.textContent = 'お名前を教えてください';
      } else {
        badge.textContent = '質問 ' + currentQIndex + ' / 35';
        label.textContent = QUESTIONS[currentQIndex];
      }
    }

    const QUESTION_KEYWORDS = [
      ["お名前"],
      ["生年月日"],
      ["性別"],
      ["国籍"],
      ["ビザ", "在留資格"],
      ["いつまで有効", "有効", "期限"],
      ["運転免許"],
      ["その他の資格"],
      ["経験のある仕事", "どんな仕事"],
      ["技能試験"],
      ["日本語試験"],
      ["キャリアアップカード"],
      ["身長"],
      ["体重"],
      ["靴のサイズ", "靴"],
      ["服のサイズ", "服"],
      ["就業状況", "在職", "離職"],
      ["希望の業種", "業種"],
      ["希望の勤務地", "勤務地"],
      ["希望する仕事内容", "仕事内容"],
      ["譲れない", "希望条件"],
      ["一時帰国"],
      ["犯罪歴"],
      ["不許可歴"],
      ["強制送還", "出国命令"],
      ["配偶者"],
      ["宗教"],
      ["血液型"],
      ["趣味", "特技"],
      ["タトゥー"],
      ["タバコ", "喫煙"],
      ["お酒", "飲酒"],
      ["働きたい理由"],
      ["特定技能2号"],
      ["健康状態"],
      ["お金", "何に使"],
    ];

    function detectQuestionFromText(text) {
      // 質問N： パターンを最優先で検出
      const numMatch = text.match(/質問\s*(\d+)[：:]/);
      if (numMatch) {
        const n = parseInt(numMatch[1]);
        if (n >= 1 && n <= 35 && n !== currentQIndex) {
          currentQIndex = n;
          updateQuestionUI();
        }
        return;
      }
      // キーワードマッチング（スコアリング方式）
      let bestIdx = -1, bestScore = 0;
      QUESTION_KEYWORDS.forEach(function(keywords, i) {
        let score = 0;
        keywords.forEach(function(kw) { if (text.includes(kw)) score++; });
        if (score > bestScore) { bestScore = score; bestIdx = i; }
      });
      if (bestScore > 0 && bestIdx >= 0 && bestIdx !== currentQIndex) {
        currentQIndex = bestIdx;
        updateQuestionUI();
      }
    }

    function scheduleSave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveLog(false), 3000);
    }

    async function saveLog(completed) {
      if (!sessionId) return;
      try {
        await fetch('/api/interview-save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, answers, completed }),
        });
      } catch (e) { console.error('Save error:', e); }
    }

    async function startInterview() {
      const btn = document.getElementById('btnStart');
      btn.disabled = true;
      setStatus('接続中...', '');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        sessionId = generateSessionId();
        const tokenRes = await fetch('/api/interview-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: selectedLanguage }),
        });
        if (!tokenRes.ok) throw new Error('トークン取得に失敗しました');
        const tokenData = await tokenRes.json();
        console.log('tokenData:', JSON.stringify(tokenData, null, 2));
        const ephemeralKey = tokenData.value;
        if (!ephemeralKey) throw new Error('トークンが無効です');

        pc = new RTCPeerConnection();
        audioEl = document.createElement('audio');
        audioEl.autoplay = true;
        pc.ontrack = (e) => { audioEl.srcObject = e.streams[0]; };
        stream.getTracks().forEach(track => pc.addTrack(track, stream));

        dc = pc.createDataChannel('oai-events');
        dc.onopen = () => {
          isConnected = true;
          setStatus('AIが話しています...', 'speaking');
          setWaveState('ai-speaking');
          btn.style.display = 'none';
          document.getElementById('guideCard').style.display = 'none';
          setTimeout(() => {
            dc.send(JSON.stringify({
              type: 'session.update',
              session: {
                turn_detection: {
                  type: 'server_vad',
                  threshold: 0.8,
                  prefix_padding_ms: 500,
                  silence_duration_ms: 1000
                }
              }
            }));
            dc.send(JSON.stringify({ type: 'response.create' }));
          }, 2000);
        };
        dc.onmessage = (e) => handleRealtimeEvent(JSON.parse(e.data));

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        const sdpRes = await fetch(
          'https://api.openai.com/v1/realtime/calls?model=gpt-4o-mini-realtime-preview',
          {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + ephemeralKey, 'Content-Type': 'application/sdp' },
            body: offer.sdp,
          }
        );
        if (!sdpRes.ok) throw new Error('WebRTC接続に失敗しました');
        await pc.setRemoteDescription({ type: 'answer', sdp: await sdpRes.text() });

      } catch (err) {
        console.error(err);
        showError('エラー: ' + err.message);
        btn.disabled = false;
        setStatus('エラーが発生しました');
      }
    }

    function handleRealtimeEvent(event) {
      console.log('[RT event]', event.type, JSON.stringify(event).slice(0, 150));
      switch (event.type) {
        case 'response.audio_transcript.delta':
          currentAiText += event.delta || '';
          document.getElementById('questionLabel').textContent = currentAiText;
          setStatus('AIが話しています...', 'speaking');
          setWaveState('ai-speaking');
          break;
        case 'response.audio_transcript.done':
          if (currentAiText) {
            detectQuestionFromText(currentAiText);
            if (currentAiText.includes('面談はこれで終了') || currentAiText.includes('またいつでも話しかけて')) {
              setTimeout(showConfirmationScreen, 2000);
            }
            currentAiText = '';
          }
          setStatus('お話しください...', 'listening');
          setWaveState('');
          break;
        case 'input_audio_buffer.speech_started':
          document.getElementById('questionLabel').textContent = '';
          setStatus('聞いています...', 'listening');
          setWaveState('user-speaking');
          break;
        case 'input_audio_buffer.speech_stopped':
          setStatus('処理中...', '');
          setWaveState('');
          break;
        case 'conversation.item.input_audio_transcription.completed':
          if (event.transcript && event.transcript.trim()) {
            answers[currentQIndex].answer = event.transcript.trim();
            console.log('[transcription.completed] Q' + currentQIndex + ':', answers[currentQIndex].answer);
            scheduleSave();
          }
          break;
        case 'conversation.item.created':
          if (event.item && event.item.role === 'user' && event.item.type === 'message') {
            const content = event.item.content && event.item.content[0];
            const transcript = content && (content.transcript || content.text);
            if (transcript && transcript.trim()) {
              answers[currentQIndex].answer = transcript.trim();
              console.log('[item.created] Q' + currentQIndex + ' → "' + answers[currentQIndex].answer + '"');
              currentQIndex = Math.min(currentQIndex + 1, answers.length - 1);
              scheduleSave();
            }
          }
          break;
        case 'conversation.item.done':
          if (event.item && event.item.role === 'user') {
            const content = event.item.content && event.item.content[0];
            const transcript = content && (content.transcript || content.text);
            console.log('[item.done user]', JSON.stringify(event.item).slice(0, 200));
            if (transcript && transcript.trim()) {
              answers[currentQIndex].answer = transcript.trim();
              console.log('[saved] Q' + currentQIndex + ':', transcript.trim());
              currentQIndex = Math.min(currentQIndex + 1, answers.length - 1);
              scheduleSave();
            }
          }
          break;
        case 'response.done':
          setStatus('お話しください...', 'listening');
          break;
        case 'error':
          if (event.error?.code !== 'invalid_value') {
            showError('接続エラーが発生しました');
          }
          console.error('Realtime error:', JSON.stringify(event, null, 2));
          break;
      }
    }

    function showConfirmationScreen() {
      isConnected = false;
      if (saveTimer) clearTimeout(saveTimer);
      saveLog(true);
      if (dc) { dc.close(); dc = null; }
      if (pc) { pc.close(); pc = null; }
      if (audioEl) { audioEl.srcObject = null; audioEl = null; }
      renderConfirmation();
      document.getElementById('screenInterview').style.display = 'none';
      document.getElementById('screenConfirmation').style.display = 'flex';
    }

    function renderConfirmation() {
      const scroll = document.getElementById('confirmScroll');
      scroll.innerHTML = '';
      answers.forEach(function(item, i) {
        const numLabel = i === 0 ? '名前確認' : '質問 ' + i + ' / 35';
        const div = document.createElement('div');
        div.className = 'qa-item';
        div.id = 'qa-item-' + i;
        div.innerHTML =
          '<div class="qa-num">' + numLabel + '</div>' +
          '<div class="qa-q">' + item.question + '</div>' +
          '<div class="qa-row" id="qa-row-' + i + '">' +
            '<div class="qa-a ' + (item.answer ? '' : 'empty') + '" id="qa-a-' + i + '">' +
              (item.answer || '（未回答）') +
            '</div>' +
            '<button class="btn-qa-edit" onclick="editAnswer(' + i + ')">✏️</button>' +
          '</div>';
        scroll.appendChild(div);
      });
    }

    function editAnswer(i) {
      const row = document.getElementById('qa-row-' + i);
      const current = answers[i].answer;
      row.innerHTML =
        '<div class="qa-edit-wrap">' +
          '<textarea class="qa-edit-input" id="qa-edit-' + i + '">' + current + '</textarea>' +
          '<div class="qa-edit-actions">' +
            '<button class="btn-qa-save" onclick="saveAnswer(' + i + ')">保存</button>' +
            '<button class="btn-qa-cancel" onclick="cancelEdit(' + i + ')">キャンセル</button>' +
          '</div>' +
        '</div>';
      document.getElementById('qa-edit-' + i).focus();
    }

    function saveAnswer(i) {
      answers[i].answer = (document.getElementById('qa-edit-' + i).value || '').trim();
      restoreRow(i);
    }

    function cancelEdit(i) {
      restoreRow(i);
    }

    function restoreRow(i) {
      const row = document.getElementById('qa-row-' + i);
      const a = answers[i].answer;
      row.innerHTML =
        '<div class="qa-a ' + (a ? '' : 'empty') + '" id="qa-a-' + i + '">' + (a || '（未回答）') + '</div>' +
        '<button class="btn-qa-edit" onclick="editAnswer(' + i + ')">✏️</button>';
    }

    async function submitInterview() {
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = '送信中...';
      await saveLog(true);
      btn.textContent = '✅ 送信完了しました！';
    }
  </script>
</body>
</html>
